<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | Sprint Egypt</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2 { margin-bottom: 20px; color: var(--accent); }
        .admin-section { background: var(--bg-card); padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid var(--border); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; color: var(--text-muted); }
        input, select, textarea { padding: 12px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; outline: none; font-size: 0.95rem; }
        input:focus, select:focus { border-color: var(--accent); }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        
        .tags-manager { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .tag-chip { background: var(--border); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .tag-chip span { cursor: pointer; color: var(--danger); font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--text-muted); }
        img.thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-gauge-high"></i> لوحة تحكم متجر Sprint Egypt</h1>

        <!-- 1. تحكم نصوص وصور الواجهة الرئيسية والباقدجات (الكاردز) -->
        <div class="admin-section">
            <h2><i class="fa-solid fa-image"></i> تخصيص الواجهة الرئيسية وباقدجات الأقسام</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>عنوان البانر الرئيسي (Hero Title)</label>
                    <input type="text" id="set-title">
                </div>
                <div class="form-group">
                    <label>وصف البانر الرئيسي</label>
                    <input type="text" id="set-desc">
                </div>
                <div class="form-group">
                    <label>رابط صورة البانر الرئيسي</label>
                    <input type="text" id="set-bannerImg">
                </div>
            </div>

            <h3 style="margin: 15px 0 10px; font-size: 1.1rem; color: var(--text-muted);">صور باقدجات الأقسام في الرئيسية:</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>صورة التشكيلة الرجالية (ID: 1)</label>
                    <input type="text" id="cat-img-1">
                </div>
                <div class="form-group">
                    <label>صورة التشكيلة النسائية (ID: 2)</label>
                    <input type="text" id="cat-img-2">
                </div>
                <div class="form-group">
                    <label>صورة ملابس كاجوال للجنسين (ID: 4)</label>
                    <input type="text" id="cat-img-4">
                </div>
                <div class="form-group">
                    <label>صورة ملابس الأطفال (ID: 3)</label>
                    <input type="text" id="cat-img-3">
                </div>
            </div>
            <button class="btn-primary" onclick="saveSettings()">حفظ التعديلات العامة</button>
        </div>

        <!-- 2. إضافة وتعديل المنتجات -->
        <div class="admin-section">
            <h2 id="form-mode-title"><i class="fa-solid fa-box-open"></i> إضافة منتج جديد</h2>
            <input type="hidden" id="edit-product-id">
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المنتج *</label>
                    <input type="text" id="p-title" placeholder="مثال: تيشرت قطن فخم">
                </div>
                <div class="form-group">
                    <label>سعر الجملة (الرئيسي) *</label>
                    <input type="number" id="p-price" placeholder="250">
                </div>
                <div class="form-group">
                    <label>السعر القطاعي (القديم)</label>
                    <input type="number" id="p-oldPrice" placeholder="300">
                </div>
                <div class="form-group">
                    <label>رابط الصورة *</label>
                    <input type="text" id="p-img" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>القسم الأساسي *</label>
                    <select id="p-category">
                        <option value="1">ملابس رجالى</option>
                        <option value="2">ملابس حريمى</option>
                        <option value="4">ملابس كاجوال للجنسين</option>
                        <option value="3">ملابس أطفال</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نوع القطعة / الخامات</label>
                    <input type="text" id="p-fabric" placeholder="قطن 100% / انترلوك">
                </div>
            </div>

            <!-- إدارة الألوان بحرية (إضافة وحذف) -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label>الألوان المتاحة:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-color-input" placeholder="اكتب اللون (مثال: كحلي)">
                    <button type="button" class="btn-primary" onclick="addColorChip()">إضافة لون</button>
                </div>
                <div class="tags-manager" id="colors-chips-container"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn-success" id="save-product-btn" onclick="saveProductToCloud()">حفظ المنتج في المتجر</button>
                <button class="btn-danger" id="cancel-edit-btn" style="display:none;" onclick="resetProductForm()">إلغاء التعديل</button>
            </div>
        </div>

        <!-- 3. جدول المنتجات الحالية -->
        <div class="admin-section">
            <h2><i class="fa-solid fa-list"></i> إدارة المنتجات المسجلة</h2>
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>اسم المنتج</th>
                        <th>القسم</th>
                        <th>السعر</th>
                        <th>التحكم</th>
                    </tr>
                </thead>
                <tbody id="admin-products-table">
                    <!-- يتم جلب المنتجات هنا برمجياً -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- كود ربط وإدارة السيرفر (Firebase) للوحة التحكم -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQqBi4aKGjrbVjIzSvmscmAYSVGeUbfzg",
            authDomain: "sprent-cffc6.firebaseapp.com",
            databaseURL: "https://sprent-cffc6-default-rtdb.firebaseio.com",
            projectId: "sprent-cffc6",
            storageBucket: "sprent-cffc6.firebasestorage.app",
            messagingSenderId: "858069126936",
            appId: "1:858069126936:web:cab9d421a7ac4de14ed86d",
            measurementId: "G-TEWN0253WH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let activeColorsList = ["أسود", "أبيض", "رمادي"];
        window.allProductsGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            renderColorChips();
            
            // جلب البيانات والإعدادات الحالية من قاعدة البيانات
            onValue(ref(db), (snapshot) => {
                const data = snapshot.val() || {};
                
                // جلب الإعدادات والبانر وصور الأقسام
                if(data.settings) {
                    document.getElementById("set-title").value = data.settings.title || "";
                    document.getElementById("set-desc").value = data.settings.desc || "";
                    document.getElementById("set-bannerImg").value = data.settings.bannerImg || "";
                    document.getElementById("cat-img-1").value = data.settings.catImg1 || "";
                    document.getElementById("cat-img-2").value = data.settings.catImg2 || "";
                    document.getElementById("cat-img-4").value = data.settings.catImg4 || "";
                    document.getElementById("cat-img-3").value = data.settings.catImg3 || "";
                }

                // جلب المنتجات وعرضها في الجدول
                const tbody = document.getElementById("admin-products-table");
                tbody.innerHTML = "";
                window.allProductsGlobal = data.products ? (Array.isArray(data.products) ? data.products.filter(Boolean) : Object.values(data.products)) : [];

                window.allProductsGlobal.forEach((prod, index) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><img class="thumb" src="${prod.img}" onerror="this.src='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=100'"></td>
                        <td>${prod.title}</td>
                        <td>${getCatName(prod.category)}</td>
                        <td>${prod.price} ج.م</td>
                        <td>
                            <button class="btn-primary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="window.loadProductToEdit('${prod.id}')">تعديل</button>
                            <button class="btn-danger" style="padding: 6px 10px; font-size: 0.8rem;" onclick="window.deleteProduct('${prod.id}')">حذف</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        });

        function getCatName(catId) {
            if(catId == "1") return "رجالى";
            if(catId == "2") return "حريمى";
            if(catId == "4") return "كاجوال للجنسين";
            if(catId == "3") return "أطفال";
            return "عام";
        }

        // حفظ إعدادات الموقع والصور الخاصة بالباقدجات والبانر
        window.saveSettings = function() {
            const settingsData = {
                title: document.getElementById("set-title").value,
                desc: document.getElementById("set-desc").value,
                bannerImg: document.getElementById("set-bannerImg").value,
                catImg1: document.getElementById("cat-img-1").value,
                catImg2: document.getElementById("cat-img-2").value,
                catImg4: document.getElementById("cat-img-4").value,
                catImg3: document.getElementById("cat-img-3").value,
            };

            set(ref(db, 'settings'), settingsData)
                .then(() => alert("تم حفظ وتحديث إعدادات وصور الموقع بنجاح! ✨"))
                .catch(err => alert("حدث خطأ: " + err.message));
        }

        // إدارة الألوان (إضافة وحذف)
        window.addColorChip = function() {
            const input = document.getElementById("new-color-input");
            const val = input.value.trim();
            if(val && !activeColorsList.includes(val)) {
                activeColorsList.push(val);
                input.value = "";
                renderColorChips();
            }
        }

        window.removeColorChip = function(colorName) {
            activeColorsList = activeColorsList.filter(c => c !== colorName);
            renderColorChips();
        }

        function renderColorChips() {
            const container = document.getElementById("colors-chips-container");
            container.innerHTML = "";
            activeColorsList.forEach(color => {
                const chip = document.createElement("div");
                chip.className = "tag-chip";
                chip.innerHTML = `${color} <span onclick="window.removeColorChip('${color}')">&times;</span>`;
                container.appendChild(chip);
            });
        }

        // حفظ أو تحديث منتج
        window.saveProductToCloud = function() {
            const editId = document.getElementById("edit-product-id").value;
            const title = document.getElementById("p-title").value.trim();
            const price = document.getElementById("p-price").value.trim();
            const oldPrice = document.getElementById("p-oldPrice").value.trim();
            const img = document.getElementById("p-img").value.trim();
            const category = document.getElementById("p-category").value;
            const fabric = document.getElementById("p-fabric").value.trim();

            if(!title || !price || !img) {
                alert("من فضلك أدخل البيانات الأساسية (الاسم، السعر، ورابط الصورة).");
                return;
            }

            const productId = editId ? editId : 'p_' + Date.now();
            const productObj = {
                id: productId,
                title,
                price: Number(price),
                oldPrice: oldPrice ? Number(oldPrice) : Number(price),
                img,
                category,
                fabric: fabric || "قطن فخم",
                colors: activeColorsList,
                sizes: ["M", "L", "XL", "XXL"]
            };

            set(ref(db, `products/${productId}`), productObj)
                .then(() => {
                    alert("تم حفظ المنتج بنجاح! 🚀");
                    window.resetProductForm();
                })
                .catch(err => alert("خطأ: " + err.message));
        }

        // تحميل بيانات منتج للتعديل
        window.loadProductToEdit = function(id) {
            const prod = window.allProductsGlobal.find(p => String(p.id) === String(id));
            if(!prod) return;

            document.getElementById("edit-product-id").value = prod.id;
            document.getElementById("p-title").value = prod.title;
            document.getElementById("p-price").value = prod.price;
            document.getElementById("p-oldPrice").value = prod.oldPrice || "";
            document.getElementById("p-img").value = prod.img;
            document.getElementById("p-category").value = prod.category;
            document.getElementById("p-fabric").value = prod.fabric || "";
            
            if(prod.colors && Array.isArray(prod.colors)) {
                activeColorsList = [...prod.colors];
                renderColorChips();
            }

            document.getElementById("form-mode-title").innerHTML = `<i class="fa-solid fa-pen-to-square"></i> تعديل المنتج: ${prod.title}`;
            document.getElementById("save-product-btn").innerText = "تحديث بيانات المنتج";
            document.getElementById("cancel-edit-btn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetProductForm = function() {
            document.getElementById("edit-product-id").value = "";
            document.getElementById("p-title").value = "";
            document.getElementById("p-price").value = "";
            document.getElementById("p-oldPrice").value = "";
            document.getElementById("p-img").value = "";
            document.getElementById("p-fabric").value = "";
            activeColorsList = ["أسود", "أبيض", "رمادي"];
            renderColorChips();

            document.getElementById("form-mode-title").innerHTML = `<i class="fa-solid fa-box-open"></i> إضافة منتج جديد`;
            document.getElementById("save-product-btn").innerText = "حفظ المنتج في المتجر";
            document.getElementById("cancel-edit-btn").style.display = "none";
        }

        // حذف منتج
        window.deleteProduct = function(id) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) {
                remove(ref(db, `products/${id}`))
                    .then(() => alert("تم الحذف بنجاح"))
                    .catch(err => alert("خطأ أثناء الحذف"));
            }
        }
    </script>
</body>
</html>
